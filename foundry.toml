[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.25"
optimizer = true
optimizer_runs = 200

# remappings
remappings = ["forge-std/=lib/forge-std/src/"]

# 테스트가 snarkjs 로 미리 만든 증명(fixtures)을 읽는다
fs_permissions = [{ access = "read", path = "./test/fixtures" }]

# snarkjs 가 생성한 verifier 는 손대지 않는 파일이라 린트에서 제외한다
[lint]
ignore = ["src/02-zk-reason/verifiers/*.sol"]
